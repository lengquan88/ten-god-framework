# .github/workflows/test.yml — TenGod Framework v4.9.1
# CI/CD Pipeline: 代码检查 + 单元测试 + 评估基准
# ============================================================================
# 触发条件: push 到 main/develop 分支，或 PR 到 main

name: TenGod CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 手动触发

jobs:
  # ── 代码质量检查 ──────────────────────────────────────────────
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8 pytest

      - name: Ruff 代码规范检查
        run: ruff check tengod/ --output-format=github || true

      - name: 语法完整性检查
        run: |
          python -c "
          import py_compile, glob, sys
          errors = []
          for f in glob.glob('tengod/**/*.py', recursive=True):
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print(f'{len(errors)} 个文件语法错误:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print(f'所有 Python 文件语法正常')
          "

  # ── 单元测试 ──────────────────────────────────────────────────
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest pytest-cov pytest-timeout

      - name: 运行测试
        run: |
          pytest tests/ -v --tb=short --timeout=30 --cov=tengod --cov-report=term \
            --ignore=tests/test_eval.py \
            -k "not slow" \
            || echo "::warning::部分测试失败，继续执行"

      - name: 上传覆盖率
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ── 评估基准 ──────────────────────────────────────────────────
  benchmark:
    name: 评估基准
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install numpy 2>/dev/null || true

      - name: 运行评估
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          try:
              from tengod.eval.run_eval import main
              main()
          except Exception as e:
              print(f'评估执行异常: {e}')
              print('::warning::评估基准未完成，检查依赖')
          "

      - name: 上报评估指标
        if: success()
        run: |
          echo "## 评估基准摘要" >> $GITHUB_STEP_SUMMARY
          echo '| 指标 | 值 |' >> $GITHUB_STEP_SUMMARY
          echo '|------|-----|' >> $GITHUB_STEP_SUMMARY
          python -c "
          import json, os
          report_path = 'reports/eval_report.json'
          if os.path.exists(report_path):
              with open(report_path) as f:
                  report = json.load(f)
              for k, v in report.get('aggregate', {}).items():
                  print(f'| {k} | {v:.4f} |')
          else:
              print('| 状态 | 报告未生成 |')
          " >> $GITHUB_STEP_SUMMARY