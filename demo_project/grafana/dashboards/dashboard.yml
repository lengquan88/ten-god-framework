# grafana/dashboards/dashboard.yml — TenGod Framework v4.9.1
# Grafana Dashboard 自动加载配置
# ============================================================================

apiVersion: 1

providers:
  - name: "TenGod"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards